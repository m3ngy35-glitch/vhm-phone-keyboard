<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>VHM Phone Keyboard</title>
<style>
  :root { --bg:#fff; --fg:#111; --mut:#777; --line:#e3e3e3; --acc:#111; --card:#f1f1f1; --me:#0a7cff; --chip:#fff3c4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#eee; --mut:#999; --line:#2e2e2e; --acc:#eee; --card:#262626; --chip:#4a3f12; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--fg); display:flex; flex-direction:column; height:100dvh;
         font:16px/1.45 "Noto Sans Khmer","Khmer OS System","Kantumruy Pro",system-ui,sans-serif; }
  header { display:flex; align-items:center; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); }
  #cust { flex:1; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #dot { font-size:12px; }
  #findBtn { border:none; background:none; font-size:20px; padding:2px 6px; color:var(--fg); }
  #chat { flex:1; overflow-y:auto; padding:10px 10px 4px; display:flex; flex-direction:column; gap:4px; }
  .b { max-width:80%; padding:7px 11px; border-radius:16px; white-space:pre-wrap; word-wrap:break-word; font-size:15px; }
  .b.customer { align-self:flex-start; background:var(--card); border-bottom-left-radius:4px; }
  .b.shop { align-self:flex-end; background:var(--me); color:#fff; border-bottom-right-radius:4px; }
  .b.unknown { align-self:center; background:none; color:var(--mut); font-size:13px; }
  .empty { color:var(--mut); font-size:14px; text-align:center; margin:auto; padding:20px; }
  #tpl { border-top:1px solid var(--line); padding:6px 8px 0; }
  #search { display:none; width:100%; font:inherit; font-size:15px; border:1px solid var(--line); border-radius:10px;
            padding:7px 10px; background:var(--bg); color:var(--fg); margin-bottom:6px; }
  #search.on { display:block; }
  #strip { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; }
  #strip:empty { display:none; }
  .t { flex:0 0 auto; max-width:72vw; background:var(--chip); color:var(--fg); border-radius:12px; padding:6px 10px; font-size:14px; }
  .t b { display:block; font-size:12px; }
  .t span { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  footer { padding:6px 8px calc(6px + env(safe-area-inset-bottom)); }
  .row { display:flex; gap:6px; align-items:flex-end; }
  textarea { flex:1; font:inherit; font-size:16px; border:1px solid var(--line); border-radius:18px; padding:8px 12px;
             background:var(--bg); color:var(--fg); resize:none; height:42px; max-height:140px; }
  button.act { font:inherit; font-weight:600; border-radius:18px; padding:9px 12px; border:1px solid var(--line);
               background:var(--bg); color:var(--fg); white-space:nowrap; }
  button.dark { background:var(--me); color:#fff; border-color:var(--me); }
  button:disabled { opacity:.5; }
  #status { font-size:12px; color:var(--mut); text-align:center; min-height:16px; margin-top:3px; }
  #info { font-size:10px; color:var(--mut); text-align:center; word-break:break-all; }
  #info a { color:var(--mut); }
  #setup { padding:20px; }
  #setup input { width:100%; font:inherit; padding:10px; margin:6px 0 14px; border:1px solid var(--line);
                 border-radius:10px; background:var(--bg); color:var(--fg); }
</style>
</head>
<body>
<div id="setup" hidden>
  <h3>VHM Phone Keyboard</h3>
  <p>បើក link ពី VHM Chat Assist នៅលើ laptop · Open the link copied from VHM Chat Assist on the laptop.</p>
  <label>Database URL</label><input id="sDb">
  <label>Laptop code</label><input id="sCode">
  <button class="act dark" id="sGo" style="width:100%">ភ្ជាប់ · Connect</button>
</div>

<div id="app" style="display:none">
  <header>
    <span id="cust">—</span>
    <button id="findBtn" aria-label="Search templates">🔍</button>
    <span id="dot">○</span>
  </header>
  <div id="chat"></div>
  <div id="tpl">
    <input id="search" placeholder="ស្វែងរកគំរូ · Search templates">
    <div id="strip"></div>
  </div>
  <footer>
    <div class="row">
      <textarea id="box" rows="1" placeholder="វាយសារ · Type"></textarea>
      <button id="ins" class="act">បញ្ចូល</button>
      <button id="snd" class="act dark">ផ្ញើ</button>
    </div>
    <div id="status"></div>
    <div id="info"></div>
  </footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
let cfg = {}, data = {}, es = null, pending = 0, lastChatKey = '';

// ---- config from link (#db=...&k=...) or saved ----
function readConfig() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('db') && h.get('k')) {
    cfg = { db: h.get('db').replace(/\/+$/, ''), k: h.get('k') };
    try { localStorage.setItem('vhmkb', JSON.stringify(cfg)); } catch {}
    history.replaceState(null, '', location.pathname);
  } else {
    try { cfg = JSON.parse(localStorage.getItem('vhmkb') || '{}'); } catch { cfg = {}; }
  }
  return cfg.db && cfg.k;
}
const url = (sub) => `${cfg.db}/vhmkb/${cfg.k}${sub ? '/' + sub : ''}.json`;

// ---- live data from the laptop ----
function setPath(obj, path, val) {
  const parts = path.split('/').filter(Boolean);
  if (!parts.length) return val;
  const root = (obj && typeof obj === 'object') ? obj : {};
  let o = root;
  for (const p of parts.slice(0, -1)) { if (!o[p] || typeof o[p] !== 'object') o[p] = {}; o = o[p]; }
  const last = parts[parts.length - 1];
  if (val === null) delete o[last]; else o[last] = val;
  return root;
}

function connect() {
  if (es) es.close();
  es = new EventSource(url(''));
  es.onopen = () => { $('dot').textContent = '🟢'; showInfo(); };
  es.onerror = async () => {
    $('dot').textContent = '🔴';
    try {
      const r = await fetch(url(''));
      showInfo('Test: HTTP ' + r.status + ' ' + (await r.text()).slice(0, 80));
    } catch (err) { showInfo('Test failed: ' + (err.message || err)); }
  };
  const apply = (e, patch) => {
    let ev; try { ev = JSON.parse(e.data); } catch { return; }
    if (patch) for (const k in ev.data) data = setPath(data, ev.path + '/' + k, ev.data[k]);
    else data = setPath(data, ev.path, ev.data);
    render();
  };
  es.addEventListener('put', (e) => apply(e, false));
  es.addEventListener('patch', (e) => apply(e, true));
}

function showInfo(extra) {
  const info = $('info');
  info.textContent = (extra ? extra + ' · ' : '') + (cfg.db || '').replace(/^https:\/\//, '').split('.')[0] + ' · ' + cfg.k + ' · ';
  const a = document.createElement('a'); a.href = '#'; a.textContent = 'Reset';
  a.onclick = (e) => { e.preventDefault(); try { localStorage.removeItem('vhmkb'); } catch {} location.href = location.pathname; };
  info.appendChild(a);
}

const norm = (s) => (s || '').toLowerCase();

function renderChat(st) {
  const msgs = st.messages || [];
  const key = (st.customer || '') + JSON.stringify(msgs);
  if (key === lastChatKey) return;
  lastChatKey = key;
  const chat = $('chat');
  const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;
  chat.innerHTML = '';
  if (!msgs.length) {
    chat.innerHTML = '<div class="empty">បើកឆាតនៅលើ laptop · Open a chat on the laptop</div>';
    return;
  }
  for (const m of msgs) {
    const d = document.createElement('div');
    d.className = 'b ' + (m.who === 'customer' || m.who === 'shop' ? m.who : 'unknown');
    d.textContent = m.text;
    chat.appendChild(d);
  }
  if (atBottom || true) chat.scrollTop = chat.scrollHeight;
}

function renderTemplates(st) {
  const q = norm($('search').value.trim());
  let items;
  if (q) {
    items = (data.templates || []).filter((t) =>
      norm(t.title).includes(q) || norm(t.text).includes(q) || (t.keywords || []).some((k) => norm(k).includes(q)))
      .map((t) => ({ title: t.title, text: t.text.replace(/\{name\}/g, st.customer || 'បង') }));
  } else items = st.matches || [];
  const strip = $('strip');
  strip.innerHTML = '';
  for (const it of items) {
    const c = document.createElement('div'); c.className = 't';
    const b = document.createElement('b'); b.textContent = it.title || '';
    const s = document.createElement('span'); s.textContent = it.text;
    c.append(b, s);
    c.onclick = () => { $('box').value = it.text; grow(); $('box').focus(); };
    strip.appendChild(c);
  }
}

function render() {
  data = data || {};
  const st = data.state || {};
  $('cust').textContent = st.customer || '—';
  renderChat(st);
  renderTemplates(st);
  const ack = data.ack;
  if (pending && ack && ack.ts === pending) {
    $('status').textContent = ack.ok ? (ack.sent ? '✓ ផ្ញើរួច · Sent' : '✓ បានបញ្ចូល · Inserted on laptop')
                                     : '✗ មិនបាន — បើកឆាតលើ laptop · Failed — open the chat on the laptop';
    if (ack.ok) { $('box').value = ''; grow(); }
    pending = 0; lock(false);
  }
}

function lock(on) { $('ins').disabled = on; $('snd').disabled = on; }
function grow() { const b = $('box'); b.style.height = '42px'; b.style.height = Math.min(b.scrollHeight + 2, 140) + 'px'; }

async function push(send) {
  const text = $('box').value.trim();
  if (!text) return;
  const ts = Date.now();
  pending = ts; lock(true);
  $('status').textContent = 'កំពុងផ្ញើ · Sending…';
  try {
    const r = await fetch(url('in'), { method: 'PUT', body: JSON.stringify({ text, send, ts }) });
    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text()).slice(0, 80));
  } catch (e) {
    $('status').textContent = '✗ ' + (e.message || e);
    pending = 0; lock(false); return;
  }
  setTimeout(() => {
    if (pending === ts) {
      $('status').textContent = '✗ laptop មិនឆ្លើយ — បើក panel VHM · Laptop not answering — open the VHM panel';
      pending = 0; lock(false);
    }
  }, 8000);
}

$('ins').onclick = () => push(false);
$('snd').onclick = () => push(true);
$('box').oninput = grow;
$('search').oninput = render;
$('findBtn').onclick = () => {
  const s = $('search');
  s.classList.toggle('on');
  if (s.classList.contains('on')) s.focus(); else { s.value = ''; render(); }
};

function start() {
  $('setup').hidden = true;
  $('app').style.display = 'contents';
  showInfo();
  connect();
}
$('sGo').onclick = () => {
  cfg = { db: $('sDb').value.trim().replace(/\/+$/, ''), k: $('sCode').value.trim() };
  if (!cfg.db || !cfg.k) return;
  try { localStorage.setItem('vhmkb', JSON.stringify(cfg)); } catch {}
  start();
};

if (readConfig()) start(); else $('setup').hidden = false;
document.addEventListener('visibilitychange', () => { if (!document.hidden && cfg.db) connect(); });
</script>
</body>
</html>
